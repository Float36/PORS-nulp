apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  labels:
    app: ad-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ad-service
  template:
    metadata:
      labels:
        app: ad-service
    spec:
      containers:
        - name: ad-service
          image: ad_service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: PROJECT_NAME
              value: "Lost&Found Ad Service"
            - name: API_V1_STR
              value: /api/v1
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8001"
            - name: POSTGRES_HOST
              value: postgres-ad
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: lostfound_ads_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: admin
            - name: DB_ECHO
              value: "false"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: USER_SERVICE_BASE_URL
              value: http://user-service:8000
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001
---
apiVersion: v1
kind: Service
metadata:
  name: ad-service
  labels:
    app: ad-service
spec:
  type: NodePort
  selector:
    app: ad-service
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30081
