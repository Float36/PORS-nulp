apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user_service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PROJECT_NAME
              value: "Lost&Found User Service"
            - name: API_V1_STR
              value: /api/v1
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: POSTGRES_HOST
              value: postgres-user
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: lostfound_users_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: admin
            - name: DB_ECHO
              value: "false"
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
